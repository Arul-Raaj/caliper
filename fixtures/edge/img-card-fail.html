<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Templates</title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f4f4f2;color:#1b1b1b}
main{max-width:1040px;margin:0 auto;padding:32px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.tpl{background:#fff;border:1px solid #e1e1de;border-radius:12px;overflow:hidden}
.tpl img{display:block}
.tpl__body{padding:12px 16px}
h2{font-size:18px;margin:0}
</style></head><body><main>
<h1>Templates</h1>
<div class="grid">
<article class="tpl"><img src="img/screenshot-520x292.png" alt="Weekly report preview"><div class="tpl__body"><h2>Weekly report</h2><p>Charts and a summary table.</p></div></article>
<article class="tpl"><img src="img/screenshot-520x292.png" alt="Invoice preview"><div class="tpl__body"><h2>Invoice</h2><p>Line items, tax and totals.</p></div></article>
<article class="tpl"><img src="img/screenshot-520x292.png" alt="Roadmap preview"><div class="tpl__body"><h2>Roadmap</h2><p>Quarters and milestones.</p></div></article>
</div></main></body></html>
