<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolbar</title>
<style>
body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1d1d1f; background: #f6f6f4; }
main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
/* The base rule reads a variable the page never sets, but every button
   here is a variant whose own rule wins, so the variable is never used. */
.btn { color: var(--btn-ink); padding: 8px 16px; border: 0; border-radius: 8px; }
.btn.primary { color: #fff; background: #1d4ed8; }
/* Inside a container query that doesn't hold, and in a pseudo-element of an element that isn't there. */
@container (max-width: 100px) { .toolbar { gap: var(--tight-gap); } }
.missing::before { content: var(--missing-icon); }
</style></head><body>
<main><h1>Toolbar</h1><div class="toolbar" style="container-type: inline-size; display: flex; gap: 8px"><button class="btn primary">Save</button><button class="btn primary">Publish</button></div></main>
</body></html>
