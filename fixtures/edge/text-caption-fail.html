<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gallery</title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#fff;color:#1b1b1b}
main{max-width:1040px;margin:0 auto;padding:32px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
figure{margin:0;position:relative;border-radius:12px;overflow:hidden}
figure img{display:block;width:100%;height:220px;object-fit:cover}
figcaption{position:absolute;inset:auto 0 0 0;padding:32px 14px 12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.25))}
</style></head><body><main>
<h1>Gallery</h1>
<div class="grid">
<figure><img src="img/card-dark-600x400.png" alt="The canal at night"><figcaption>The canal at night, by Ines</figcaption></figure>
<figure><img src="img/card-dark-600x400.png" alt="Lanterns"><figcaption>Lanterns over the bridge, by Omar</figcaption></figure>
</div></main></body></html>
