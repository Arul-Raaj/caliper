<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: #1d232b; background: #f6f7f9; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 24px; margin: 0 0 16px; }
  h2 { font-size: 18px; margin: 32px 0 12px; }
  button { font: inherit; }
</style>
<title>Rows spaced with gap</title>
<style>
  .team { display: flex; flex-wrap: wrap; gap: 16px 3.5%; list-style: none; margin: 0; padding: 0; }
  .person { width: 31%; padding: 16px; background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .person img { border-radius: 50%; margin-bottom: 8px; }
  .person span { color: #55606c; }
  .stats { display: flex; flex-wrap: wrap; gap: 16px; }
  .stat { width: 210px; padding: 16px; background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; display: flex; flex-direction: column; }
  .stat b { font-size: 24px; }
  .stat span { color: #55606c; }
  footer { background: #1d232b; color: #c8ced6; padding: 24px 16px; }
  .links { max-width: 640px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 24px; }
  .links a { color: #e8ebef; text-decoration: none; padding: 4px 0; }
</style></head><body><main>
<h1>Our team</h1>
<ul class="team">
  <li class="person"><img src="img/avatar.svg" width="64" height="64" alt=""><b>Priya Nair</b><span>Engineering</span></li>
  <li class="person"><img src="img/avatar.svg" width="64" height="64" alt=""><b>Tom Becker</b><span>Design</span></li>
  <li class="person"><img src="img/avatar.svg" width="64" height="64" alt=""><b>Ana Souza</b><span>Support</span></li>
  <li class="person"><img src="img/avatar.svg" width="64" height="64" alt=""><b>Kenji Mori</b><span>Sales</span></li>
  <li class="person"><img src="img/avatar.svg" width="64" height="64" alt=""><b>Lea Fischer</b><span>Finance</span></li>
</ul>
<h2>This week</h2>
<div class="stats">
  <div class="stat"><b>12,480</b><span>Orders</span></div>
  <div class="stat"><b>₹8.2L</b><span>Revenue</span></div>
  <div class="stat"><b>3.4%</b><span>Refund rate</span></div>
  <div class="stat"><b>4.8</b><span>Avg rating</span></div>
  <div class="stat"><b>96%</b><span>On-time</span></div>
</div>
</main>
<footer><nav class="links" aria-label="Footer">
  <a href="#">About</a><a href="#">Careers</a><a href="#">Press</a><a href="#">Blog</a><a href="#">Help centre</a><a href="#">Privacy</a><a href="#">Terms</a>
</nav></footer>
</body></html>
