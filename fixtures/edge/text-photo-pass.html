<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Night Market</title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#fff;color:#1b1b1b}
.hero{position:relative;height:440px;background:#1c2230}
.hero__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background-color:#1c2230}
.hero__text{position:relative;max-width:1040px;margin:0 auto;padding:120px 16px 0;color:#fff}
.hero__text h1{font-size:48px;margin:0}
main{max-width:1040px;margin:0 auto;padding:32px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.guide{height:240px;border-radius:12px;background:#1c2230 url(img/card-dark-600x400.png) center / cover no-repeat;display:flex;align-items:flex-end;padding:16px;color:#fff;text-decoration:none}
.guide h2{margin:0;font-size:22px}
figure{margin:0;position:relative;border-radius:12px;overflow:hidden;background:#1c2230}
figure img{display:block;width:100%;height:240px;object-fit:cover;background-color:#1c2230}
figcaption{position:absolute;inset:auto 0 0 0;padding:32px 14px 12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6))}
</style></head><body>
<header class="hero"><img class="hero__img" src="img/hero-dark-1440x600.png" alt=""><div class="hero__text"><h1>Night Market</h1><p>Fridays from 6 pm, Canal Street.</p></div></header>
<main><div class="grid">
<a class="guide" href="#lisbon"><div><span>12 places</span><h2>Lisbon after dark</h2></div></a>
<figure><img src="img/card-dark-600x400.png" alt="The canal at night"><figcaption>The canal at night, by Ines</figcaption></figure>
</div></main>
</body></html>
