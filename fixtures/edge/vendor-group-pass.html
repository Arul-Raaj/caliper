<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#1d1d1f;background:#f6f6f4}
main{max-width:720px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;margin:0 0 16px}
button{font:inherit}

.signup{max-width:380px;background:#1e1f24;color:#f2f2f2;border-radius:12px;padding:20px}
.signup label{display:block;font-size:14px;margin:12px 0 4px}
.signup input{width:100%;padding:10px 12px;border:1px solid #3a3b42;border-radius:8px;background:#2a2b31;color:#fff;font:inherit}
.signup input::-webkit-input-placeholder{color:#c9cad1}
.signup input:-moz-placeholder{color:#c9cad1}
.signup button{margin-top:16px;width:100%;padding:10px;border:0;border-radius:8px;background:#7c5cff;color:#fff;font-weight:600}

</style></head><body>
<main><form class="signup"><h1>Create account</h1><label for="e">Email</label><input id="e" type="email" placeholder="you@example.com"><label for="p">Password</label><input id="p" type="password" placeholder="At least 12 characters"><button type="submit">Sign up</button></form></main></body></html>
