<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fixture</title><style>body{margin:0;padding:24px;font:14px sans-serif}.sheet{display:none;position:fixed;top:80px;left:-40px;width:200px;padding:8px;background:#fff;border:1px solid #ccc}.sheet.open{display:block}</style></head><body><button class=step-one>Next</button><button class=step-two hidden>Show sheet</button><div class=sheet role=dialog>A sheet behind two clicks</div><script>const a=document.querySelector(".step-one"),b=document.querySelector(".step-two");a.onclick=()=>{b.hidden=false};b.onclick=()=>document.querySelector(".sheet").classList.add("open")</script></body></html>
