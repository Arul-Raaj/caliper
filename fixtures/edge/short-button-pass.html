<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#1d1d1f;background:#f6f6f4}
main{max-width:720px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;margin:0 0 16px}
button{font:inherit}

.dialog{max-width:420px;background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.dialog h2{margin:0 0 8px;font-size:18px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn{min-width:90px;min-height:40px;padding:6px 10px;border-radius:6px;border:1px solid #1a56db;background:#1a56db;color:#fff;font-size:15px}
.btn.ghost{background:#fff;color:#1a56db}

</style></head><body>
<main dir="rtl" lang="ar"><div class="dialog" role="dialog" aria-labelledby="t"><h2 id="t">تم الحفظ</h2><p>تم حفظ التغييرات في ملفك الشخصي.</p><div class="actions"><button class="btn ghost" type="button">لا</button><button class="btn" type="button">تم</button></div></div></main></body></html>
