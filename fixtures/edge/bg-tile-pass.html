<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Harbour Days</title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#fff;color:#1b1b1b}
.hero{min-height:520px;background:#28465f url(img/bg-1200x700.png) center / cover no-repeat;display:flex;align-items:flex-end}
.hero__in{max-width:1040px;margin:0 auto;padding:32px 16px;width:100%}
.hero h1{font-size:44px;margin:0;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
main{max-width:1040px;margin:0 auto;padding:32px 16px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.plan{background:#fff url(img/mark-96.png) right 12px bottom 12px / 64px no-repeat;border:1px solid #e3e3e0;border-radius:12px;padding:20px;min-height:220px}
.quotes{background:#28465f url(img/bg-600x400.png) center / cover no-repeat;padding:40px 16px;margin-top:32px}
.quotes__in{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
blockquote{margin:0;background:#fff;border-radius:12px;padding:16px}
.dots{height:40px;background-image:radial-gradient(#ccc 1px,transparent 1px);background-size:12px 12px;margin-top:24px}
</style></head><body>
<section class="hero"><div class="hero__in"><h1>Harbour Days</h1></div></section>
<main><div class="plans">
<section class="plan"><h2>Starter</h2><p>One project, three people.</p></section>
<section class="plan"><h2>Team</h2><p>Unlimited projects, twenty people.</p></section>
</div><div class="dots" aria-hidden="true"></div></main>
<section class="quotes"><div class="quotes__in">
<blockquote>We moved our whole team in an afternoon.</blockquote>
<blockquote>The export alone saves me two hours every Friday.</blockquote>
<blockquote>Support answered on a Sunday.</blockquote>
</div></section>
</body></html>
