<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#1d1d1f;background:#f6f6f4}
main{max-width:720px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;margin:0 0 16px}
button{font:inherit}

.thread{display:flex;flex-direction:column;gap:12px}
.msg{position:relative;background:#fff;border:1px solid #ddd;border-radius:12px;padding:10px 12px}
.msg .bubble{max-width:calc(100% - var(--actions-width))}
.msg .actions{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.msg .actions button{width:32px;height:32px;border:1px solid #ccc;border-radius:6px;background:#f5f5f5}

</style></head><body>
<main><h1>Design review</h1><div class="thread"><div class="msg"><div class="bubble">Can we move the review to Thursday afternoon, after the design sync with the platform team?</div><div class="actions"><button type="button" aria-label="Reply"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="2"/></svg></button><button type="button" aria-label="Copy"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="2"/></svg></button><button type="button" aria-label="Pin"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="2"/></svg></button></div></div><div class="msg"><div class="bubble">Works for me. I will send the updated agenda and the notes from last week before then.</div><div class="actions"><button type="button" aria-label="Reply"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="2"/></svg></button><button type="button" aria-label="Copy"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="2"/></svg></button><button type="button" aria-label="Pin"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="2"/></svg></button></div></div></div></main>
<script src="actions-width-missing.js"></script></body></html>
