<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Release notes</title>
<style>
img{max-width:100%;height:auto;object-fit:cover}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#fff;color:#222}
article{max-width:680px;margin:0 auto;padding:40px 16px}
figure{margin:24px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:1040px;margin:0 auto;padding:0 16px}
.tpl{background:#fff;border:1px solid #e1e1de;border-radius:12px;overflow:hidden}
.tpl img{display:block}
.tpl__body{padding:12px 16px}
.recipe{display:flex;gap:20px;padding:16px 0;border-bottom:1px solid #eee}
.recipe img{width:40%;flex:none;align-self:flex-start}
.product{max-width:1040px;margin:0 auto;padding:32px 16px;display:grid;grid-template-columns:1fr 1fr;gap:32px}
@media (max-width:700px){.product{grid-template-columns:1fr}}
.product img{display:block;border-radius:8px}
</style></head><body>
<article>
<h1>What changed in March</h1>
<p>The export screen now remembers your last folder.</p>
<figure><img src="img/figure-900x506.png" alt="The new export screen"></figure>
<div class="recipe"><img src="img/thumb-360x540.png" alt="Lentil soup"><div><h2>Lentil soup</h2><p>Forty minutes, one pot.</p></div></div>
</article>
<div class="grid">
<article class="tpl"><img src="img/screenshot-520x292.png" alt="Weekly report preview"><div class="tpl__body"><h2>Weekly report</h2></div></article>
<article class="tpl"><img src="img/screenshot-520x292.png" alt="Invoice preview"><div class="tpl__body"><h2>Invoice</h2></div></article>
</div>
<section class="product"><div><img src="img/figure-900x506.png" alt="Trail jacket"></div><div><h2>Trail jacket</h2><p>120 EUR</p></div></section>
</body></html>
