<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Team</title>
<style>
:root{--bg:#fff;--fg:#1b1b1b;--ring:#000}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--ring:#fff}}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:860px;margin:0 auto;padding:32px 16px}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:24px;list-style:none;padding:0}
.avatar{position:relative;width:96px;height:96px;margin-bottom:8px}
.avatar img{display:block;width:100%;height:100%;border-radius:50%}
.avatar__ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ring);opacity:.1;pointer-events:none}
.apps{display:flex;gap:24px;list-style:none;padding:0}
.apps .avatar{width:72px;height:72px}
.apps .avatar img,.apps .avatar__ring{border-radius:16px}
.team span{opacity:.7}
</style></head><body><main>
<h1>The team</h1>
<ul class="team">
<li><div class="avatar"><img src="img/avatar-white.png" alt=""><span class="avatar__ring"></span></div><strong>Ravi Menon</strong><br><span>Engineering</span></li>
<li><div class="avatar"><img src="img/avatar-offwhite.png" alt=""><span class="avatar__ring"></span></div><strong>Sofia Lind</strong><br><span>Design</span></li>
</ul>
<ul class="apps"><li><div class="avatar"><img src="img/logo-white.png" alt=""><span class="avatar__ring"></span></div>Notes</li></ul>
</main></body></html>
