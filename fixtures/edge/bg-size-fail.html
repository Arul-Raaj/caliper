<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Listings</title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f7f7f5;color:#1b1b1b}
main{max-width:1040px;margin:0 auto;padding:32px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.listing{background:#fff;border:1px solid #e3e3e0;border-radius:12px;overflow:hidden}
.listing__photo{height:200px;background-size:100% 100%;background-repeat:no-repeat}
.listing__body{padding:12px 16px}
h2{font-size:18px;margin:0}
</style></head><body><main>
<h1>Homes for rent</h1>
<div class="grid">
<article class="listing"><div class="listing__photo" style="background-image:url(img/portrait-600x900.png)" role="img" aria-label="Garden flat"></div><div class="listing__body"><h2>Garden flat</h2><p>2 rooms, 54 m2</p></div></article>
<article class="listing"><div class="listing__photo" style="background-image:url(img/wide-2000x600.png)" role="img" aria-label="Loft"></div><div class="listing__body"><h2>Loft</h2><p>1 room, 40 m2</p></div></article>
</div></main></body></html>
