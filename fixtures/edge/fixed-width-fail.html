<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#1d1d1f;background:#f6f6f4}
main{max-width:720px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;margin:0 0 16px}
button{font:inherit}

.layout{display:flex;gap:16px;padding:16px}
.filters{width:280px;flex:none;background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px}
.results{flex:1;min-width:0;background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px}

</style></head><body>
<div class="layout"><aside class="filters"><h2>Filters</h2><p>Size, colour and price.</p></aside><section class="results"><h2>42 results</h2><p>Sorted by newest first.</p></section></div></body></html>
