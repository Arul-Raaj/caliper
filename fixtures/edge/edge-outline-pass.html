<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Team</title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#fff;color:#1b1b1b}
main{max-width:860px;margin:0 auto;padding:32px 16px}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:24px;list-style:none;padding:0}
.team img{display:block;width:96px;height:96px;border-radius:50%;margin-bottom:8px;outline:1px solid rgba(0,0,0,.12);outline-offset:-1px}
.apps{display:flex;gap:24px;list-style:none;padding:0}
.apps img{display:block;width:72px;height:72px;border-radius:16px;outline:1px solid rgba(0,0,0,.12);outline-offset:-1px}
</style></head><body><main>
<h1>The team</h1>
<ul class="team">
<li><img src="img/avatar-white.png" alt=""><strong>Ravi Menon</strong></li>
<li><img src="img/avatar-offwhite.png" alt=""><strong>Sofia Lind</strong></li>
</ul>
<ul class="apps"><li><img src="img/logo-white.png" alt="">Notes</li><li><img src="img/logo-glyph.png" alt="">Calendar</li></ul>
</main></body></html>
