<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Support inbox</title>
<style>
*{box-sizing:border-box} body{margin:0;font:15px/1.4 system-ui,sans-serif;color:#1d1d1f;background:#f5f5f7}
.app{display:flex;gap:24px;padding:24px;max-width:1100px;margin:0 auto}
.side{flex:0 0 260px;height:420px;background:#fff;border-radius:12px;padding:8px;overflow-y:auto;scrollbar-gutter:stable;}
.side ul{list-style:none;margin:0;padding:0} .side a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:inherit;text-decoration:none}
.side a:first-child{background:#eef3fb}
.txt{display:flex;flex-direction:column;min-width:0} .name{font-weight:600} .desc{color:#6e6e73;font-size:13px}
.count{flex:none;background:#e5e5ea;border-radius:10px;padding:0 8px;font-size:13px;font-variant-numeric:tabular-nums}
.content{flex:1;min-width:0;background:#fff;border-radius:12px;padding:20px}
</style></head><body><div class="app"><nav class="side" aria-label="Folders"><ul><li><a href="#"><span class="txt"><span class="name">Inbox</span><span class="desc">Messages from customers</span></span><span class="count">12</span></a></li><li><a href="#"><span class="txt"><span class="name">Assigned</span><span class="desc">Tickets you own</span></span><span class="count">4</span></a></li><li><a href="#"><span class="txt"><span class="name">Mentions</span><span class="desc">Where your name came up</span></span><span class="count">2</span></a></li><li><a href="#"><span class="txt"><span class="name">Drafts</span><span class="desc">Replies not sent yet</span></span><span class="count">7</span></a></li><li><a href="#"><span class="txt"><span class="name">Snoozed</span><span class="desc">Back on Monday</span></span><span class="count">3</span></a></li><li><a href="#"><span class="txt"><span class="name">Archived</span><span class="desc">Closed this month</span></span><span class="count">128</span></a></li></ul></nav>
<section class="content"><h1>Inbox</h1><p>Pick a conversation on the left to read it here.</p></section></div></body></html>
