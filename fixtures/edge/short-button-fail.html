<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#1d1d1f;background:#f6f6f4}
main{max-width:720px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;margin:0 0 16px}
button{font:inherit}

.search{display:flex;gap:6px;max-width:480px}
.search input{flex:1;padding:8px 10px;border:1px solid #bbb;border-radius:6px;font:inherit}
.search button{padding:4px 8px;border:0;border-radius:6px;background:#0f766e;color:#fff;font-size:14px}

</style></head><body>
<main><h1>Find an order</h1><form class="search" role="search"><input type="search" placeholder="Order number" aria-label="Order number"><button type="submit">Go</button></form></main></body></html>
