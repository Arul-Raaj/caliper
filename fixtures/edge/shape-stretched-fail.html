<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: #1d232b; background: #f6f7f9; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 24px; margin: 0 0 16px; }
  h2, h3 { margin: 0; }
  p { margin: 0; }
  button { font: inherit; }
</style>
<title>Comment thread</title>
<style>
  .person { display: flex; gap: 16px; padding: 16px; background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; }
  .person__avatar { width: 72px; border-radius: 50%; }
  .person__content p { color: #55606c; }
  .cart { list-style: none; margin: 0; padding: 0; background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; }
  .line { display: flex; gap: 12px; padding: 12px; border-top: 1px solid #e3e6ea; }
  .line:first-child { border-top: 0; }
  .line__thumb { width: 80px; border-radius: 8px; }
  .line__info { flex: 1; display: flex; flex-direction: column; }
  .line__info span { color: #55606c; font-size: 14px; }
  .comments { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .comment { display: flex; gap: 12px; }
  .comment p { color: #3c4652; }
  .avatar { width: 40px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #dbe7f5; color: #1f4f8b; font-weight: 600; font-size: 14px; }
  .features { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
  .feature { display: flex; gap: 16px; }
  .feature h3 { font-size: 16px; }
  .feature p { color: #55606c; }
  .feature__icon { width: 44px; flex: none; display: grid; place-items: center; border-radius: 12px; background: #e3f4ea; color: #1b7a43; }
  
</style></head><body><main>
<h1>Activity</h1>
<ul class="comments">
  <li class="comment"><span class="avatar" aria-hidden="true">MS</span><div><b>Maya Singh</b><p>Shipped the fix for the login loop.</p></div></li>
  <li class="comment"><span class="avatar" aria-hidden="true">JL</span><div><b>Jonas Lind</b><p>Confirmed on staging, thanks.</p></div></li>
</ul>
</main></body></html>
