<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notifications</title>
<style>
*{box-sizing:border-box} body{margin:0;font:15px/1.4 system-ui,sans-serif;color:#1d1d1f;background:#f5f5f7}
main{max-width:960px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:#fff;border-radius:12px;padding:16px}
.card h2{font-size:16px;margin:0 0 8px}
.list{height:220px;overflow-y:scroll;margin:0;padding:0 8px 0 0;list-style:none}
.list li{padding:8px 0;border-bottom:1px solid #f2f2f7}
.list time{display:block;color:#6e6e73;font-size:13px}
</style></head><body><main>
<section class="card"><h2>Notifications</h2><ul class="list"><li>Your export is ready<time>2 min ago</time></li><li>Dana commented on Q3 plan<time>1 h ago</time></li></ul></section>
<section class="card"><h2>Recent files</h2><ul class="list"><li>Budget 2027.xlsx<time>Yesterday</time></li></ul></section>
<section class="card"><h2>Team</h2><p>Six people, two open seats. Invite a teammate from Settings.</p></section>
</main></body></html>
