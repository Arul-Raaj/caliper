<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Newsletter</title>
<style>
*{box-sizing:border-box} body{margin:0;font:14px/1.5 system-ui,sans-serif;color:#1d1d1f;background:#f5f5f7}
form{max-width:480px;margin:24px auto;background:#fff;border-radius:16px;padding:24px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:13px}
input[type=email],select,textarea{width:100%;font-family:inherit;font-size:16px;padding:8px 10px;border:1px solid #c7c7cc;border-radius:8px;background:#fff}
.check{display:flex;gap:8px;align-items:center;font-weight:400}
button{margin-top:16px;font:inherit;padding:10px 18px;border:0;border-radius:8px;background:#0a66c2;color:#fff}
</style></head><body><form><h1>Monthly notes</h1><label for="e">Email</label><input id="e" type="email" placeholder="you@example.com">
<label for="f">How often</label><select id="f"><option>Monthly</option><option>Quarterly</option></select>
<label class="check"><input type="checkbox"> Also send product news</label><button>Subscribe</button></form></body></html>
